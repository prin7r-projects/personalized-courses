services:
  postgres:
    image: postgres:16-alpine
    container_name: curriculum7-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: curriculum7
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curriculum7}
      POSTGRES_DB: curriculum7
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curriculum7"]
      interval: 5s
      timeout: 3s
      retries: 5

  landing:
    build:
      context: .
      dockerfile: Dockerfile.landing
    image: personalized-courses-landing:latest
    container_name: personalized-courses-landing
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.personalized-courses.rule=Host(`personalized-courses.prin7r.com`)"
      - "traefik.http.routers.personalized-courses.entrypoints=websecure"
      - "traefik.http.routers.personalized-courses.tls.certresolver=letsencrypt"
      - "traefik.http.services.personalized-courses.loadbalancer.server.port=3000"

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: curriculum7-app:latest
    container_name: curriculum7-app
    restart: unless-stopped
    expose:
      - "3100"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traefik
      - internal
    labels:
      - "traefik.enable=true"
      # Dedicated subdomain via wildcard DNS — no PathPrefix conflicts
      - "traefik.http.routers.curriculum7-app.rule=Host(`app.personalized-courses.prin7r.com`)"
      - "traefik.http.routers.curriculum7-app.priority=50"
      - "traefik.http.routers.curriculum7-app.entrypoints=websecure"
      - "traefik.http.services.curriculum7-app.loadbalancer.server.port=3100"

networks:
  traefik:
    external: true
  internal:

volumes:
  pgdata:
